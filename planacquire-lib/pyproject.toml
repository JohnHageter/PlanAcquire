[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "planacquire_lib"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "h5py",
    "typing_extensions",
]

[project.optional-dependencies]
ids  = ["ids_peak", "ids_peak_ipl"]

[tool.setuptools.packages.find]
where = ["."]
include = ["planacquire_lib*"]
